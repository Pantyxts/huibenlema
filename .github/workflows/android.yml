name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eink:
    name: Eink unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and eink debug build
        run: ./gradlew :app:testEinkDebugUnitTest :app:assembleEinkDebug --stacktrace
